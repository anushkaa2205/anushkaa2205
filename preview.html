<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README preview · anushkaa2205</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
<style>
  body { background:#0d1117; margin:0; padding:32px 16px; }
  .wrap { max-width:896px; margin:0 auto; border:1px solid #30363d; border-radius:8px; padding:32px; }
  .markdown-body { background:transparent; }
  .bar { max-width:896px; margin:0 auto 12px; color:#8b949e; font:14px/1.4 system-ui,sans-serif; }
</style>
</head>
<body>
<div class="bar">Local preview of <b>README.md</b>. Edit the file and refresh. GitHub renders slightly differently.</div>
<div class="wrap"><article id="out" class="markdown-body">Loading README.md…</article></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
fetch('README.md').then(r => r.text()).then(t => {
  document.getElementById('out').innerHTML = marked.parse(t);
}).catch(() => {
  document.getElementById('out').innerHTML =
    '<p>Could not load README.md from disk. In this folder run <code>python -m http.server</code> and open <code>http://localhost:8000/preview.html</code>.</p>';
});
</script>
</body>
</html>
