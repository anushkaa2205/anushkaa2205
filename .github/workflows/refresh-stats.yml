name: Refresh profile stats

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [master]
    paths:
      - "scripts/build_stats.py"
      - "scripts/build_languages.py"
      - ".github/workflows/refresh-stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats + streak cards
        env:
          # Optional: add a classic PAT (read:user) as secret STATS_TOKEN to include private contributions
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/build_stats.py

      - name: Build languages card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/build_languages.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add assets/stats*.svg assets/streak*.svg assets/stats.json assets/languages*.svg assets/languages.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile stats"
            git pull --rebase
            git push
          fi